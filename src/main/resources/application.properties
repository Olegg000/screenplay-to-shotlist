spring.application.name=screenplay-to-shotlist

# OpenAI key is read from the OPENAI_API_KEY environment variable (see .env.example).
# Spring AI rejects an empty key while wiring beans, so an unset key would crash the
# context on startup. The placeholder keeps the app (and the tests) bootable without a
# key: requests to the model then fail with 401, which is the honest failure mode.
spring.ai.openai.api-key=${OPENAI_API_KEY:key-not-set}

# Uploaded screenplays can be large; raise the multipart limits.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.org.springframework=INFO
logging.level.org.springframework.ai=INFO
logging.level.app.screenplay=INFO
