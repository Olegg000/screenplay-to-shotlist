spring.application.name=screenplay-to-shotlist

# OpenAI key is read from the OPENAI_API_KEY environment variable (see .env.example).
# Empty default lets the app and tests start without a key; requests fail only when the key is missing.
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Uploaded screenplays can be large; raise the multipart limits.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.org.springframework=INFO
logging.level.org.springframework.ai=INFO
logging.level.app.screenplay=INFO
